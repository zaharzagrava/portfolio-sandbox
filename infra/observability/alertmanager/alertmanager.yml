# SD-33 / O-01 routing: severity=page → on-call pager, severity=ticket → team channel.
# Receivers are placeholders (webhook URLs come from Secrets Manager in AWS).
route:
  receiver: team-channel
  group_by: [alertname, slo, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: on-call
      repeat_interval: 1h

# A paging burn-rate alert makes the slow-burn ticket for the same SLO redundant.
inhibit_rules:
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [slo]

receivers:
  - name: on-call
    webhook_configs:
      - url: http://host.docker.internal:9095/pagerduty-stub
        send_resolved: true
  - name: team-channel
    webhook_configs:
      - url: http://host.docker.internal:9095/slack-stub
        send_resolved: true
