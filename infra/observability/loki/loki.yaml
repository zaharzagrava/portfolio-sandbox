# SD-33 Loki (single binary, local). Index = labels only (service, level, env);
# everything else is in the JSON line and queried with `| json`.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore: { store: inmemory }
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }

limits_config:
  # Cardinality guard: a log label with ids in it would be rejected here, not discovered on the bill.
  max_label_names_per_series: 8
  max_label_value_length: 128
  retention_period: 168h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
