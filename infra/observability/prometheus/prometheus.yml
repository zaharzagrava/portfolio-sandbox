# SD-33 Prometheus (local). In AWS: ADOT collectors remote-write to Amazon
# Managed Prometheus with EC2 service discovery on the ASG tag `service` (O-03);
# the rule files below are uploaded to AMP unchanged.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Nest apps run on the host during development (pnpm start:dev:*); ports from SERVICE_METRICS_PORTS.
  - job_name: apps
    static_configs:
      - { targets: ['host.docker.internal:9464'], labels: { service: core } }
      - { targets: ['host.docker.internal:9465'], labels: { service: worker } }
      - { targets: ['host.docker.internal:9466'], labels: { service: projector } }
      - { targets: ['host.docker.internal:9467'], labels: { service: sse-gateway } }
      - { targets: ['host.docker.internal:9468'], labels: { service: payment-processor } }
      - { targets: ['host.docker.internal:9469'], labels: { service: collab } }
      - { targets: ['host.docker.internal:9470'], labels: { service: public-api } }
      - { targets: ['host.docker.internal:9471'], labels: { service: bff } }

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
