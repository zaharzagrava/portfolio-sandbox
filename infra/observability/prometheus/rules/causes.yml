# SD-33 / O-01 cause-based alerts: things that WILL become user-visible soon.
# Symptom (SLO burn-rate) alerts are generated from docs/slo/*.yaml → slo.generated.yml.
# Every alert links its runbook; severity routes in alertmanager.yml.
groups:
  - name: data-stores
    rules:
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: { severity: page }
        annotations:
          summary: 'Postgres connections at {{ $value | humanizePercentage }} of max_connections'
          runbook: docs/runbooks/PostgresConnectionsHigh.md

      - alert: DbPoolWaiting
        expr: max by (service) (db_client_connection_pending_requests) > 5
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.service }}: requests queueing for a DB connection'
          runbook: docs/runbooks/PostgresConnectionsHigh.md

      - alert: RedisMemoryHigh
        expr: max(redis_memory_used_bytes) / max(redis_memory_max_bytes > 0) > 0.85
        for: 10m
        labels: { severity: page }
        annotations:
          summary: 'Redis memory at {{ $value | humanizePercentage }} of maxmemory (evictions next)'
          runbook: docs/runbooks/RedisMemoryHigh.md

  - name: async-pipelines
    rules:
      - alert: KafkaConsumerLagHigh
        expr: sum by (consumergroup) (kafka_consumergroup_lag) > 10000
        for: 10m
        labels: { severity: page }
        annotations:
          summary: 'Consumer group {{ $labels.consumergroup }} is {{ $value }} messages behind'
          runbook: docs/runbooks/KafkaConsumerLagHigh.md

      - alert: ProjectionLagHigh
        expr: histogram_quantile(0.95, sum by (le, projector) (rate(projection_lag_seconds_bucket[5m]))) > 30
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: 'Read model {{ $labels.projector }} p95 freshness {{ $value | humanizeDuration }}'
          runbook: docs/runbooks/ProjectionLagHigh.md

      - alert: DLQNotEmpty
        expr: max by (queue) (sqs_queue_messages{dlq="true", state="visible"}) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: 'Dead-letter queue {{ $labels.queue }} has {{ $value }} messages'
          runbook: docs/runbooks/DLQNotEmpty.md

      - alert: JobQueueLagging
        expr: max(job_queue_lag_seconds) > 300
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: 'Scheduled jobs are running {{ $value | humanizeDuration }} late'
          runbook: docs/runbooks/DLQNotEmpty.md

  - name: business-invariants
    rules:
      - alert: FlashSaleOversellDetected
        expr: increase(flash_sale_stock_drift_units_total[1h]) > 0
        labels: { severity: page }
        annotations:
          summary: 'Flash sale stock drift of {{ $value }} units at reconciliation (Redis lost writes)'
          runbook: docs/runbooks/FlashSaleOversellDetected.md

      - alert: LedgerInvariantViolated
        expr: increase(ledger_invariant_violations_total[15m]) > 0
        labels: { severity: page }
        annotations:
          summary: 'Ledger invariant violated - money may be misbooked'
          runbook: docs/runbooks/APIErrorBudgetFastBurn.md

      - alert: StripeCircuitOpen
        expr: max(circuit_breaker_open{breaker="stripe.create_payment_intent"}) == 1
        for: 1m
        labels: { severity: page }
        annotations:
          summary: 'Stripe circuit breaker open - payments are failing fast'
          runbook: docs/runbooks/StripeCircuitOpen.md

  - name: runtime
    rules:
      - alert: EventLoopBlocked
        expr: max by (service) (nodejs_eventloop_lag_p99_ms) > 200
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.service }}: event loop p99 delay {{ $value }} ms (load shedding kicks in at 250)'
          runbook: docs/runbooks/APIErrorBudgetFastBurn.md

      - alert: TelemetryTargetDown
        expr: up{job="apps"} == 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: '{{ $labels.service }} metrics endpoint is down'
