# Local SQS stand-in (D19). Every task queue gets a DLQ with maxReceiveCount,
# mirroring the Terraform `sqs` module (O-03). Queues are added here as
# sections land.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  notifications-email-dlq {}
  notifications-email { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "notifications-email-dlq", maxReceiveCount = 5 } }
  notifications-sms-dlq {}
  notifications-sms { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "notifications-sms-dlq", maxReceiveCount = 5 } }
  notifications-push-dlq {}
  notifications-push { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "notifications-push-dlq", maxReceiveCount = 5 } }
  notify-email-dlq {}
  notify-email { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "notify-email-dlq", maxReceiveCount = 5 } }
  notify-sms-dlq {}
  notify-sms { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "notify-sms-dlq", maxReceiveCount = 5 } }
  notify-push-dlq {}
  notify-push { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "notify-push-dlq", maxReceiveCount = 5 } }
  notify-marketing-email-dlq {}
  notify-marketing-email { defaultVisibilityTimeout = 120 seconds, deadLettersQueue { name = "notify-marketing-email-dlq", maxReceiveCount = 5 } }
  notify-marketing-sms-dlq {}
  notify-marketing-sms { defaultVisibilityTimeout = 120 seconds, deadLettersQueue { name = "notify-marketing-sms-dlq", maxReceiveCount = 5 } }
  notify-marketing-push-dlq {}
  notify-marketing-push { defaultVisibilityTimeout = 120 seconds, deadLettersQueue { name = "notify-marketing-push-dlq", maxReceiveCount = 5 } }
  delivery-offer-timeouts-dlq {}
  delivery-offer-timeouts { defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "delivery-offer-timeouts-dlq", maxReceiveCount = 5 } }
  chat-offline-notify-dlq {}
  chat-offline-notify { defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "chat-offline-notify-dlq", maxReceiveCount = 5 } }
  notifications-marketing-dlq {}
  notifications-marketing { defaultVisibilityTimeout = 120 seconds, deadLettersQueue { name = "notifications-marketing-dlq", maxReceiveCount = 3 } }
  payments-charge-dlq {}
  payments-charge { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "payments-charge-dlq", maxReceiveCount = 5 } }
  orders-refund-requested-dlq {}
  orders-refund-requested { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "orders-refund-requested-dlq", maxReceiveCount = 5 } }
  notifications-callbacks-dlq {}
  notifications-callbacks { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "notifications-callbacks-dlq", maxReceiveCount = 5 } }
  tenancy-invite-requested-dlq {}
  tenancy-invite-requested { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "tenancy-invite-requested-dlq", maxReceiveCount = 5 } }

  "webhook-deliveries-dlq.fifo" { fifo = true }
  "webhook-deliveries.fifo" { fifo = true, contentBasedDeduplication = false, defaultVisibilityTimeout = 30 seconds, deadLettersQueue { name = "webhook-deliveries-dlq.fifo", maxReceiveCount = 5 } }

  media-processing-dlq {}
  media-processing { defaultVisibilityTimeout = 180 seconds, deadLettersQueue { name = "media-processing-dlq", maxReceiveCount = 3 } }
  catalog-imports-dlq {}
  catalog-imports { defaultVisibilityTimeout = 300 seconds, deadLettersQueue { name = "catalog-imports-dlq", maxReceiveCount = 3 } }
  order-exports-dlq {}
  order-exports { defaultVisibilityTimeout = 300 seconds, deadLettersQueue { name = "order-exports-dlq", maxReceiveCount = 3 } }
  video-transcode-dlq {}
  video-transcode { defaultVisibilityTimeout = 900 seconds, deadLettersQueue { name = "video-transcode-dlq", maxReceiveCount = 3 } }
  integration-sync-dlq {}
  integration-sync { defaultVisibilityTimeout = 300 seconds, deadLettersQueue { name = "integration-sync-dlq", maxReceiveCount = 5 } }
  integration-backfill-dlq {}
  integration-backfill { defaultVisibilityTimeout = 900 seconds, deadLettersQueue { name = "integration-backfill-dlq", maxReceiveCount = 3 } }
  crawl-fetch-dlq {}
  crawl-fetch { defaultVisibilityTimeout = 60 seconds, deadLettersQueue { name = "crawl-fetch-dlq", maxReceiveCount = 3 } }
  function-test-runs-dlq {}
  function-test-runs { defaultVisibilityTimeout = 120 seconds, deadLettersQueue { name = "function-test-runs-dlq", maxReceiveCount = 2 } }
  knowledge-ingest-dlq {}
  knowledge-ingest { defaultVisibilityTimeout = 300 seconds, deadLettersQueue { name = "knowledge-ingest-dlq", maxReceiveCount = 5 } }
  onboarding-documents-dlq {}
  onboarding-documents { defaultVisibilityTimeout = 720 seconds, deadLettersQueue { name = "onboarding-documents-dlq", maxReceiveCount = 5 } }
  bulk-stock-updates-dlq {}
  bulk-stock-updates { defaultVisibilityTimeout = 120 seconds, deadLettersQueue { name = "bulk-stock-updates-dlq", maxReceiveCount = 5 } }
  public-api-bulk-chunk-dlq {}
  public-api-bulk-chunk { defaultVisibilityTimeout = 120 seconds, deadLettersQueue { name = "public-api-bulk-chunk-dlq", maxReceiveCount = 5 } }
}
