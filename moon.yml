# /moon.yml (Root)
#
# Every task here has side effects (Docker, DB schemas, dev servers), so none may be cached:
# a cached task only replays its old log ("(cached, …)") without running anything.
#  - long-running ones use `preset: server` (no cache, persistent, stream output until Ctrl+C),
#  - one-shot ones set `options.cache: false`.

tasks:
  # Dev stack. All of these run in the foreground (never `-d`): Ctrl+C stops them.
  #   up      start          reup     wipe this stack's containers + volumes, then start
  #   setup   start, then run the migrations once the stores answer          resetup  reup + setup
  infra-up:
    command: "scripts/infra/stack.sh dev up"
    preset: server
  infra-reup:
    command: "scripts/infra/stack.sh dev reup"
    preset: server
  infra-setup:
    command: "scripts/infra/stack.sh dev setup"
    preset: server
  infra-resetup:
    command: "scripts/infra/stack.sh dev resetup"
    preset: server

  # Only the migrations, against a stack that is already up (what infra-setup runs after starting it)
  infra-migrate:
    command: "pnpm --filter api run infra:setup"
    options:
      cache: false

  # Dev stack plus observability (Grafana :3001, Jaeger :16686, Prometheus :9090, Loki, Alertmanager, exporters)
  infra-up-observability:
    command: "docker compose --env-file packages/backend/.env --profile observability up --build"
    preset: server

  # Stop the dev stack from another terminal
  infra-down:
    command: "docker compose --env-file packages/backend/.env --profile '*' down"
    options:
      cache: false

  # Test stack for the e2e specs (ports shifted, runs next to the dev stack). Same four modes.
  infra-test-up:
    command: "scripts/infra/stack.sh test up"
    preset: server
  infra-test-reup:
    command: "scripts/infra/stack.sh test reup"
    preset: server
  infra-test-setup:
    command: "scripts/infra/stack.sh test setup"
    preset: server
  infra-test-resetup:
    command: "scripts/infra/stack.sh test resetup"
    preset: server
  infra-test-migrate:
    command: "pnpm --filter api run test:stack:migrate"
    options:
      cache: false
  infra-test-down:
    command: "docker compose -f docker-compose.test.yaml -p marketplace_test down"
    options:
      cache: false

  # Run the backend core API (:8000)
  dev-api:
    command: "pnpm --filter api run start:dev"
    preset: server

  # Run the backend GraphQL BFF (:8006)
  dev-bff:
    command: "pnpm --filter api run start:dev:bff"
    preset: server

  # Run the frontend web app (:3000)
  dev-web:
    command: "pnpm --filter web dev"
    preset: server

  # Run the SSE gateway (:8001 - live streams, assistant, payment status)
  dev-sse:
    command: "pnpm --filter api run start:dev:sse-gateway"
    preset: server

  # Run the background worker (:8003 - SQS consumers, scheduled jobs)
  dev-worker:
    command: "pnpm --filter api run start:dev:worker"
    preset: server

  # Run the Kafka projector (:8002 - read models: search, feeds, notifications, analytics)
  dev-projector:
    command: "pnpm --filter api run start:dev:projector"
    preset: server

  # Run the collaborative editor WebSocket server (:8004)
  dev-collab:
    command: "pnpm --filter api run start:dev:collab"
    preset: server

  # Run the seller public API (:8005 - /v1)
  dev-public-api:
    command: "pnpm --filter api run start:dev:public-api"
    preset: server

  # Run ALL backend apps in one Node process for low RAM usage
  dev-monolith:
    command: "pnpm --filter api run start:dev:monolith"
    preset: server

  # Wipe Docker containers, volumes and networks (destructive: all local data)
  cleanup:
    command: "pnpm --filter api run cleanup"
    options:
      cache: false
